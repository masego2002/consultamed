<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <title>ConsultaMed</title>
  <link rel="icon" href="/icon.png?v=2.5" type="image/png">
  <link rel="apple-touch-icon" href="/icon.png?v=2.5">
  <link rel="manifest" href="/manifest.webmanifest?v=2.5">
  <link rel="stylesheet" href="/styles.css?v=2.5">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="/icon.png?v=2.5" alt="">ConsultaMed <span>2.5</span></div>
    <button id="configBtn" class="icon-btn" type="button" aria-label="Configurações" aria-pressed="false">⚙</button>
  </header>

  <main class="container">
    <section id="configPanel" class="panel initial-connection">
      <h1>Conexão</h1>
      <label for="baseUrl">URL</label>
      <input id="baseUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://xxxx.trycloudflare.com">

      <label for="baseCode">Código</label>
      <input id="baseCode" type="password" inputmode="numeric" autocomplete="off" placeholder="Código de acesso">

      <label class="check-row settings-only">
        <input id="onlyStock" type="checkbox">
        <span>Somente em estoque</span>
      </label>

      <button id="updateRelations" class="settings-only settings-action" type="button">Atualizar</button>

      <div class="row">
        <button id="saveConnection" class="primary" type="button">Usar BASE</button>
        <button id="skipConnection" type="button">Continuar sem BASE</button>
      </div>
    </section>

    <section id="searchPanel" class="panel hidden">
      <div class="search-row">
        <input id="query" type="search" autocomplete="off" placeholder="Medicamento, princípio ativo ou EAN">
        <div class="search-actions">
          <button id="searchBtn" class="primary search-button" type="button">
            <span id="searchBtnSpinner" class="spinner spinner-button hidden" aria-hidden="true"></span>
            <span id="searchBtnText">Pesquisar</span>
          </button>
          <button id="otherSearchBtn" class="search-button" type="button">
            <span id="otherSearchBtnSpinner" class="spinner spinner-button hidden" aria-hidden="true"></span>
            <span id="otherSearchBtnText">Outros</span>
          </button>
          <button id="cancelSearch" class="cancel-search hidden" type="button" aria-label="Cancelar pesquisa">✕</button>
        </div>
      </div>

      <div id="status" class="status"></div>
      <div id="searchLoader" class="search-loader hidden" aria-hidden="true">
        <span class="spinner spinner-large"></span>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <dialog id="detailsDialog">
    <div class="dialog-head">
      <strong id="detailsTitle"></strong>
      <div class="dialog-actions">
        <button id="changeRelation" class="icon-btn relation-help hidden" type="button" aria-label="Alterar relação" title="Alterar relação">?</button>
        <button id="closeDetails" class="icon-btn" type="button" aria-label="Fechar">✕</button>
      </div>
    </div>
    <div id="detailsBody"></div>
  </dialog>

  <dialog id="relationsDialog">
    <div class="dialog-head">
      <strong id="relationsTitle">Relações duvidosas</strong>
      <button id="closeRelations" class="icon-btn" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="relations-content">
      <div id="relationsBody"></div>
      <button id="saveRelations" class="primary relations-save" type="button">Salvar</button>
    </div>
  </dialog>

  <script src="/app.js?v=2.5" defer></script>
</body>
</html>
